name: Daily sync

on:
  schedule:
    - cron: "0 11 * * *" # 7:00 Eastern (daylight time)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync all accounts and record today's balances
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # Retries cover a free-tier cold start.
        run: |
          curl --fail-with-body -sS -X POST "$APP_URL/api/v1/cron/sync" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 300 --retry 4 --retry-delay 30 --retry-all-errors
